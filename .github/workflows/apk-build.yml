name: Build Android APK

on:
  push:
    branches: [ "main", "dev", "nightly" ]
  pull_request:
    branches: [ "main", "dev", "nightly" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Determine build type
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            echo "build_type=release" >> "$GITHUB_ENV"
          else
            echo "build_type=debug" >> "$GITHUB_ENV"
          fi

      - name: Generate debug keystore
        if: env.build_type == 'release'
        run: |
          mkdir -p ~/.config/.android
          keytool -genkeypair -v -keystore ~/.config/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Build APK
        run: sh gradlew.bin :manager:assemble${{ env.build_type == 'release' && 'Release' || 'Debug' }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shevery-${{ env.build_type }}
          path: manager/build/outputs/apk/${{ env.build_type }}/*.apk
